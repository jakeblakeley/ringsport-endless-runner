<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
#if SHOW_DIAGNOSTICS
    <link rel="stylesheet" href="<<<TemplateData/diagnostics.css>>>">
    <script src="<<<TemplateData/diagnostics.js>>>"></script>
#endif
#if DEVELOPMENT_PLAYER
    <script src="<<<TemplateData/profiler.js>>>"></script>
#endif
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-loading-label">Loading</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-fullscreen-button" title="Fullscreen"></div>
#if SHOW_DIAGNOSTICS
      <div id="unity-diagnostics-button" title="Memory diagnostics">i</div>
#endif
#if DEVELOPMENT_PLAYER
      <div id="unity-gfx-readout"></div>
#endif
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      // Stop arrows/space/page keys from scrolling the itch.io page underneath
      // the embed while the player is driving the dog.
      var swallowKeys = [" ", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "PageUp", "PageDown"];
      window.addEventListener("keydown", function (e) {
        if (swallowKeys.indexOf(e.key) !== -1) e.preventDefault();
      }, false);

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: #b3261e; color: white; padding: 10px; border-radius: 6px;';
        else {
          if (type == 'warning') div.style = 'background: #f2c14e; padding: 10px; border-radius: 6px;';
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };

      // Retina panels otherwise render at 2-3x the pixels for no visual gain on
      // a stylised low-poly runner, and it is the cheapest frame-rate win there
      // is on web. Phones render 1:1, desktop is capped at 2x.
      config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, isMobile ? 1 : 2);

      document.querySelector("#unity-loading-bar").style.display = "block";

#if DEVELOPMENT_PLAYER
      // A WebGPU build can get as far as creating the device, claiming the
      // canvas, and then never presenting a first frame - in which case the
      // createUnityInstance promise simply never settles and the page looks
      // like it is still loading forever. Say so out loud instead.
      var settled = false;
      var lastProgress = 0;
      setTimeout(function () {
        if (settled) return;
        unityShowBanner(
          "Still not running after 45s (load progress reached " + Math.round(lastProgress * 100) + "%). " +
          "If progress hit 100% the renderer hung before presenting a first frame.", 'error');
      }, 45000);

      var gfxReadout = document.querySelector("#unity-gfx-readout");
      function reportGpu() {
        var lines = ["navigator.gpu: " + (navigator.gpu ? "present" : "MISSING")];
        gfxReadout.textContent = lines.join("\n");
        if (!navigator.gpu) return;
        navigator.gpu.requestAdapter().then(function (adapter) {
          if (!adapter) { lines.push("adapter: none"); gfxReadout.textContent = lines.join("\n"); return; }
          var info = adapter.info || {};
          lines.push("adapter: " + (info.vendor || "?") + " / " + (info.architecture || info.description || "?"));
          gfxReadout.textContent = lines.join("\n");
        }).catch(function (e) {
          lines.push("adapter error: " + e);
          gfxReadout.textContent = lines.join("\n");
        });
      }
      reportGpu();
#endif

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
#if DEVELOPMENT_PLAYER
          lastProgress = progress;
#endif
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
#if DEVELOPMENT_PLAYER
          settled = true;
#endif
          document.querySelector("#unity-loading-bar").style.display = "none";
          var fs = document.querySelector("#unity-fullscreen-button");
          // itch.io draws its own fullscreen chrome on desktop; only offer ours
          // when the page is not already framed by the itch player.
          if (!isMobile) fs.style.display = "block";
          fs.onclick = () => { unityInstance.SetFullscreen(1); };
          canvas.focus();
#if SHOW_DIAGNOSTICS
          var diag = document.querySelector("#unity-diagnostics-button");
          diag.style.display = "block";
          diag.onclick = () => { unityDiagnostics.openDiagnosticsDiv(unityInstance.GetMetricsInfo); };
#endif
#if DEVELOPMENT_PLAYER
          var profile = unityProfiler.createButton(unityInstance);
          profile.style.cssText = "position:absolute;right:90px;bottom:10px;z-index:10;";
          document.querySelector("#unity-container").appendChild(profile);
#endif
        }).catch((message) => {
#if DEVELOPMENT_PLAYER
          settled = true;
#endif
          unityShowBanner(message, 'error');
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
