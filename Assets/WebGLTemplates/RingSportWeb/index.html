<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover">
    <!-- Standalone hint: iPhone Safari has no Fullscreen API, so the only true
         fullscreen route is Add to Home Screen, which needs these. They only
         take effect when this page is the TOP-LEVEL document - inside itch.io's
         embed iframe the browser reads itch's <head>, not this one. -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Caicos 3">
    <meta name="theme-color" content="#14100f">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="TemplateData/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="TemplateData/icon-192.png">

    <!-- Titles here are hardcoded rather than {{{ PRODUCT_NAME }}} on purpose:
         PlayerSettings.productName is still the repo slug, and changing it
         would move the IndexedDB save path and wipe existing progress. -->
    <title>Caicos Gets Her Ring 3</title>
    <meta name="description" content="Endless runner mobile game depicting Caicos, a Belgium Malinois, getting her French Ring 3 title">

    <!-- Social sharing cards. og:image is RELATIVE, which iMessage, Discord,
         Slack and WhatsApp resolve fine; Facebook and X require an absolute
         URL - once the final domain is settled, prefix these two image URLs
         with it (e.g. https://caicos.example.com/TemplateData/og-image.png). -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Caicos Gets Her Ring 3">
    <meta property="og:description" content="Endless runner mobile game depicting Caicos, a Belgium Malinois, getting her French Ring 3 title">
    <meta property="og:image" content="TemplateData/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Caicos Gets Her Ring 3 logo">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Caicos Gets Her Ring 3">
    <meta name="twitter:description" content="Endless runner mobile game depicting Caicos, a Belgium Malinois, getting her French Ring 3 title">
    <meta name="twitter:image" content="TemplateData/og-image.png">
#if SHOW_DIAGNOSTICS
    <link rel="stylesheet" href="<<<TemplateData/diagnostics.css>>>">
    <script src="<<<TemplateData/diagnostics.js>>>"></script>
#endif
#if DEVELOPMENT_PLAYER
    <script src="<<<TemplateData/profiler.js>>>"></script>
#endif
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-loading-label">Loading</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-fullscreen-button" title="Fullscreen"></div>
#if SHOW_DIAGNOSTICS
      <div id="unity-diagnostics-button" title="Memory diagnostics">i</div>
#endif
#if DEVELOPMENT_PLAYER
      <div id="unity-gfx-readout"></div>
#endif
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      // Ask the browser to exempt this origin's storage - the IndexedDB that
      // Unity PlayerPrefs (scores, love notes, hats) persist into - from
      // eviction under disk pressure. Purely a flag on the existing bucket:
      // nothing is moved, migrated, or cleared, and a denial just leaves the
      // default eviction policy in place.
      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persist().catch(function () {});
      }

      // --- iOS ring/silent switch vs Web Audio --------------------------------
      // iOS Safari keeps a page that only produces Web Audio (all our SFX -
      // DecompressOnLoad clips are WebAudio buffers) in the "ambient" audio
      // session, which the hardware silent switch MUTES. An HTML <audio>
      // element is exempt, and while one is playing it promotes the whole
      // page's session, un-muting Web Audio too. Our music/ambience play
      // through <audio> elements (CompressedInMemory), so runs sound fine even
      // with the switch on - but the mini games stop the music by design
      // (GameManager.HandleMiniLevelState), the session demotes, and every
      // stinger goes silent until the next run's music starts. (2026-08-06)
      //
      // Two layers, belt and braces:
      //   1. Audio Session API (iOS 16.4+): declare playback intent outright.
      //   2. A silent looping <audio> keepalive, started on the first touch
      //      (autoplay rules), holds the session promoted on older iOS and
      //      inside the itch.io iframe if (1) doesn't stick there.
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); // iPadOS reports as Mac
      if (navigator.audioSession) {
        try { navigator.audioSession.type = "playback"; } catch (e) {}
      }
      if (isIOS) {
        var audioKeepAlive = null;
        var startAudioKeepAlive = function () {
          if (audioKeepAlive) return;
          var el = document.createElement("audio");
          el.setAttribute("playsinline", "");
          el.loop = true;
          el.preload = "auto";
          el.src = "TemplateData/silence.wav"; // 0.5s of 8-bit silence
          audioKeepAlive = el;
          var p = el.play();
          if (p && p.catch) p.catch(function () { audioKeepAlive = null; }); // blocked - retry on next touch
        };
        window.addEventListener("touchstart", startAudioKeepAlive, { passive: true });
        window.addEventListener("mousedown", startAudioKeepAlive);
      }

      // Stop arrows/space/page keys from scrolling the itch.io page underneath
      // the embed while the player is driving the dog.
      var swallowKeys = [" ", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "PageUp", "PageDown"];
      window.addEventListener("keydown", function (e) {
        if (swallowKeys.indexOf(e.key) !== -1) e.preventDefault();
      }, false);

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: #b3261e; color: white; padding: 10px; border-radius: 6px;';
        else {
          if (type == 'warning') div.style = 'background: #f2c14e; padding: 10px; border-radius: 6px;';
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };

      // Retina panels otherwise render at 2-3x the pixels for no visual gain on
      // a stylised low-poly runner, and it is the cheapest frame-rate win there
      // is on web. Phones render 1:1, desktop is capped at 2x.
      config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, isMobile ? 1 : 2);

      document.querySelector("#unity-loading-bar").style.display = "block";

#if DEVELOPMENT_PLAYER
      // A WebGPU build can get as far as creating the device, claiming the
      // canvas, and then never presenting a first frame - in which case the
      // createUnityInstance promise simply never settles and the page looks
      // like it is still loading forever. Say so out loud instead.
      var settled = false;
      var lastProgress = 0;
      setTimeout(function () {
        if (settled) return;
        unityShowBanner(
          "Still not running after 45s (load progress reached " + Math.round(lastProgress * 100) + "%). " +
          "If progress hit 100% the renderer hung before presenting a first frame.", 'error');
      }, 45000);

      var gfxReadout = document.querySelector("#unity-gfx-readout");
      function reportGpu() {
        var lines = ["navigator.gpu: " + (navigator.gpu ? "present" : "MISSING")];
        gfxReadout.textContent = lines.join("\n");
        if (!navigator.gpu) return;
        navigator.gpu.requestAdapter().then(function (adapter) {
          if (!adapter) { lines.push("adapter: none"); gfxReadout.textContent = lines.join("\n"); return; }
          var info = adapter.info || {};
          lines.push("adapter: " + (info.vendor || "?") + " / " + (info.architecture || info.description || "?"));
          gfxReadout.textContent = lines.join("\n");
        }).catch(function (e) {
          lines.push("adapter error: " + e);
          gfxReadout.textContent = lines.join("\n");
        });
      }
      reportGpu();
#endif

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
#if DEVELOPMENT_PLAYER
          lastProgress = progress;
#endif
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
#if DEVELOPMENT_PLAYER
          settled = true;
#endif
          document.querySelector("#unity-loading-bar").style.display = "none";
          var fs = document.querySelector("#unity-fullscreen-button");
          // itch.io draws its own fullscreen chrome on desktop; only offer ours
          // when the page is not already framed by the itch player.
          if (!isMobile) fs.style.display = "block";
          fs.onclick = () => { unityInstance.SetFullscreen(1); };
          canvas.focus();
#if SHOW_DIAGNOSTICS
          var diag = document.querySelector("#unity-diagnostics-button");
          diag.style.display = "block";
          diag.onclick = () => { unityDiagnostics.openDiagnosticsDiv(unityInstance.GetMetricsInfo); };
#endif
#if DEVELOPMENT_PLAYER
          var profile = unityProfiler.createButton(unityInstance);
          profile.style.cssText = "position:absolute;right:90px;bottom:10px;z-index:10;";
          document.querySelector("#unity-container").appendChild(profile);
#endif
        }).catch((message) => {
#if DEVELOPMENT_PLAYER
          settled = true;
#endif
          unityShowBanner(message, 'error');
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
